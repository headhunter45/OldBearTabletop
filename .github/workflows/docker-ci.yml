name: Docker Production Build & Publish

on:
  push:
    branches:
      - main
      - develop
      - tasks/*
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      registry:
        description: 'Docker registry URL prefix (e.g. ghcr.io/<owner>/ or registry.tomusan.com/)'
        required: false
        default: 'ghcr.io/headhunter45/'
      push:
        description: 'Push images to registry after building'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suites
        run: npm test

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: env.CUSTOM_REGISTRY_URL == ''
        env:
          CUSTOM_REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Custom Container Registry (if configured)
        if: env.CUSTOM_REGISTRY_URL != '' && env.CUSTOM_REGISTRY_PASSWORD != ''
        env:
          CUSTOM_REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          CUSTOM_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Run CI Build Script
        env:
          IMAGE_REGISTRY: ${{ inputs.registry || secrets.REGISTRY_PREFIX || format('ghcr.io/{0}/', github.repository_owner) }}
          INPUT_PUSH: ${{ inputs.push }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          PUSH_FLAG=""
          if [ "$INPUT_PUSH" = "true" ] || [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUSH_FLAG="--push"
          fi
          bash scripts/ci-build.sh ${PUSH_FLAG}
